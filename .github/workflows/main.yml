name: Build DRM Loopback

on:
  push:
    branches:
      - main  # Pastikan ini sesuai dengan branch kamu
  pull_request:
    branches:
      - main  # Pastikan ini sesuai dengan branch kamu

jobs:
  build_drm_loopback:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout source code
      - name: Checkout source
        uses: actions/checkout@v3

      # Step 2: Install dependencies
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential libdrm-dev libdrm-ast-dev \
                             libevdev-dev libpciaccess-dev libudev-dev \
                             pkg-config meson ninja-build

      # Step 3: Set up toolchain (optional, sesuaikan dengan toolchain yang kamu pilih)
      - name: Set up toolchain
        run: |
          wget https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_64_toolchain/releases/download/clang-16.0.2/clang-16.0.2-linux-x86_64.tar.xz
          tar -xvJf clang-16.0.2-linux-x86_64.tar.xz
          export PATH=$PWD/clang-16.0.2-linux-x86_64/bin:$PATH

      # Step 4: Build drm-loopback
      - name: Build drm-loopback
        run: |
          cd drm-loopback
          meson setup build
          ninja -C build

      # Step 5: Upload drm-loopback artifact
      - name: Upload drm-loopback artifact
        uses: actions/upload-artifact@v4
        with:
          name: drm-loopback-artifact
          path: build/*

      # Optional: Clean up build files
      - name: Clean up
        run: |
          rm -rf build
